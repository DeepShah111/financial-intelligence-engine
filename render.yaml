services:
  - type: web
    name: financial-intelligence-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"